<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty & Administrator Login | MathQuiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #173B68 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #173B68 0%, #2563EB 100%);
      color: white;
      padding: 2.25rem 2rem 2rem;
      text-align: center;
    }
    .login-header i {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    .login-body {
      padding: 2rem;
    }
    .form-control:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <i class="fa-solid fa-square-root-variable text-warning"></i>
    <h4 class="fw-bold mb-1">MathQuiz Portal</h4>
    <p class="mb-0 small text-white-50">Examination & Assessment Administration</p>
  </div>

  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. admin" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember" name="remember">
        <label class="form-check-label small text-secondary" for="remember">Keep me logged in</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background-color: #173B68; border-color: #173B68;">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Console
      </button>

      <div class="text-center mt-3 pt-3 border-top">
        <a href="/mathquiz/student" class="text-decoration-none small text-muted">
          <i class="fa-solid fa-graduation-cap me-1"></i> Are you a student? Open Examination Room →
        </a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
